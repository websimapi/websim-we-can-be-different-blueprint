<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>We Can Be Different - Interactive Blueprint</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
                "nipplejs": "https://esm.sh/nipplejs@0.10.1"
            }
        }
    </script>
</head>
<body>

<div id="game-root">
    
    <!-- Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Mobile Controls -->
    <div id="mobile-ui" class="hidden-desktop">
        <div id="zone-left" class="touch-zone"></div>
        <div id="zone-right" class="touch-zone"></div>
        <button id="btn-jump-p1" class="touch-btn">JUMP</button>
        <button id="btn-jump-p2" class="touch-btn">JUMP</button>
    </div>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <div class="hud-top">
            <div class="stat-box ai-stat">SYS.OP: ONLINE</div>
            <div class="doodle-text human-stat">Let's play!</div>
        </div>
        <div class="hud-bottom">
            <div class="hud-panel">
                <h3>Dual Reality Protocol</h3>
                <p>
                    <span style="color:var(--ai-primary)">P1 (AI): WASD + Space</span> | 
                    <span style="color:var(--human-bg); text-shadow: 0 0 2px black;">P2 (Human): Arrows + Shift</span>
                </p>
            </div>
        </div>
    </div>

</div>

<script type="module" src="main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
